[project]
name = "roommate"
version = "0.1.0"
# Mirrors current homeassistant's floor so the lock resolves a single HA version.
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "pytest-cov",
    "ruff==0.16.1",
]

[tool.ruff]
# Kept below requires-python: that floor is for the dev harness (current HA),
# while the integration itself runs on the Python of the oldest supported HA
# (hacs.json declares 2025.12, which ships Python 3.13).
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "LOG",    # flake8-logging
    "RUF",    # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.roommate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
